[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "maskshield-dataset-builder"
version = "1.0.0"
description = "Dataset engineering pipeline for MaskShield AI — offline masked face recognition system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "MaskShield AI Team" }]

dependencies = [
    # Configuration & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Logging
    "loguru>=0.7.2",

    # HTTP / networking
    "requests>=2.32.0",
    "tqdm>=4.66.0",

    # Image processing
    "opencv-python>=4.10.0",
    "Pillow>=10.4.0",
    "numpy>=1.26.0",
    "imagehash>=4.3.1",

    # Augmentation
    "albumentations>=1.4.0",

    # Data / reporting
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",

    # Archive handling
    "patool>=2.1.0",
    "rarfile>=4.2",

    # CLI
    "click>=8.1.7",
    "rich>=13.7.0",

    # Utilities
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "humanize>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.3",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
maskshield-prepare  = "scripts.prepare_dataset:main"
maskshield-validate = "scripts.validate_dataset:main"
maskshield-augment  = "scripts.augment_dataset:main"
maskshield-stats    = "scripts.stats:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataset_builder*", "scripts*", "config*", "services*", "utils*",
           "validators*", "augmentations*", "exporters*", "tests*"]

# ---------------------------------------------------------------------------
# Ruff (linting + formatting)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PT", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "services", "utils", "validators", "augmentations", "exporters"]

# ---------------------------------------------------------------------------
# mypy (type checking)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing"
log_cli = true
log_cli_level = "DEBUG"
